<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Otherside Culture</title>
  <link rel="stylesheet" href="assets/style.css">
</head>

<body>
  <div class="cabecalho">
    <a class="logo" href="index.html">
      <img src="assets/images/logo.png" alt="Logo Otherside Culture">
    </a>
    <nav class="cabecalho-nav">
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
    </nav>
  </div>

  <div class="secao-form">
    <div class="container-form">
      <h2>Criar conta</h2>
      <div class="campo-formulario">
        <label for="nome">Nome completo:</label>
        <input type="text" id="ipt_nome" name="nome" required>
        <span class="msg-erro" id="erro_nome"></span>
      </div>
      <div class="campo-formulario">
        <label for="email">E-mail:</label>
        <input type="email" id="ipt_email" name="email" required>
        <span class="msg-erro" id="erro_email"></span>
      </div>
      <div class="campo-formulario">
        <label for="senha">Senha:</label>
        <input type="password" id="ipt_senha" name="senha" required>
        <span class="msg-erro" id="erro_senha"></span>
      </div>
      <div class="campo-formulario">
        <label for="confirmar-senha">Confirmar senha:</label>
        <input type="password" id="ipt_confirmar_senha" name="confirmar-senha" required>
        <span class="msg-erro" id="erro_confirmar_senha"></span </div>
        <button type="submit" class="botao-form" onclick="cadastrar()">Cadastrar</button>
        <p class="link-form">Já tem uma conta? <a href="login.html">Faça login aqui</a></p>
      </div>
    </div>

    <script>

      // Array para armazenar empresas cadastradas para validação de código de ativação 
      let listaEmpresasCadastradas = [];

      function cadastrar() {
        // aguardar();

        //Recupere o valor da nova input pelo nome do id
        // Agora vá para o método fetch logo abaixo
        nomeVar = ipt_nome.value;
        emailVar = ipt_email.value;
        senhaVar = ipt_senha.value;
        confirmacaoSenhaVar = ipt_confirmar_senha.value;

        // Verificando se há algum campo em branco
        erro_nome.innerHTML = "";
        erro_email.innerHTML = "";
        erro_senha.innerHTML = "";
        erro_confirmar_senha.innerHTML = "";

        ipt_nome.classList.remove("input-invalido");
        ipt_email.classList.remove("input-invalido");
        ipt_senha.classList.remove("input-invalido");
        ipt_confirmar_senha.classList.remove("input-invalido");

        let valido = true;

        if (nomeVar == "") {
          erro_nome.innerHTML = "O nome é obrigatório.";
          ipt_nome.classList.add("input-invalido");
          valido = false;
        } else if (nomeVar.length < 3) {
          erro_nome.innerHTML = "O nome deve ter pelo menos 3 caracteres.";
          ipt_nome.classList.add("input-invalido");
          valido = false;
        }

        if (emailVar == "") {
          erro_email.innerHTML = "O e-mail é obrigatório.";
          ipt_email.classList.add("input-invalido");
          valido = false;
        } else if (!emailVar.includes("@") || !emailVar.includes(".")) {
          erro_email.innerHTML = "Informe um e-mail válido.";
          ipt_email.classList.add("input-invalido");
          valido = false;
        }

        if (senhaVar == "") {
          erro_senha.innerHTML = "A senha é obrigatória.";
          ipt_senha.classList.add("input-invalido");
          valido = false;
        } else if (senhaVar.length < 6) {
          erro_senha.innerHTML = "A senha deve ter pelo menos 6 caracteres.";
          ipt_senha.classList.add("input-invalido");
          valido = false;
        }

        if (confirmacaoSenhaVar == "") {
          erro_confirmar_senha.innerHTML = "Confirme sua senha.";
          ipt_confirmar_senha.classList.add("input-invalido");
          valido = false;
        } else if (senhaVar !== confirmacaoSenhaVar) {
          erro_confirmar_senha.innerHTML = "As senhas não coincidem.";
          ipt_confirmar_senha.classList.add("input-invalido");
          valido = false;
        }

        if (!valido) return false;



        fetch("/usuarios/cadastrar", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            // crie um atributo que recebe o valor recuperado aqui
            // Agora vá para o arquivo routes/usuario.js
            nomeServer: nomeVar,
            emailServer: emailVar,
            senhaServer: senhaVar,
          }),
        })
          .then(function (resposta) {
            console.log("resposta: ", resposta);

            if (resposta.ok) {
              alert("Cadastro realizado com sucesso! Redirecionando para tela de Login...")
              setTimeout(() => {
                window.location = "login.html";
              }, "2000");
            } else {
              throw "Houve um erro ao tentar realizar o cadastro!";
            }
          })
          .catch(function (resposta) {
            console.log(`#ERRO: ${resposta}`);
          });

        return false;
      }
    </script>
</body>

</html>
