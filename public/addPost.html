<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Postar - OutherSide Culture</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <div class="cabecalho">
      <a class="logo" href="index.html">
        <img src="assets/images/logo.png" alt="Logo Otherside Culture" />
      </a>
      <nav class="cabecalho-nav">
        <ul>
          <li><a href="posts.html">Posts</a></li>
          <li><a href="login.html">Métricas</a></li>
          <li><a id="nomeUsers"></a></li>
        </ul>
      </nav>
    </div>
    <div class="secao-form">
      <div class="container-form">
        <h2>Crie sua Postagem</h2>
        <form action="/posts/imagemPost" method="post" enctype="multipart/form-data" onsubmit="publicarPost(event)">
          <div class="campo-formulario">
            <label for="titulo">Qual o titulo do seu post?</label>
            <input type="text" id="titulo" name="titulo" required />
          </div>
          <div class="campo-formulario">
            <label for="conteudo">Qual o conteúdo do seu post?</label>
            <input type="text" id="conteudo" name="conteudo" required />
          </div>
          <div class="campo-formulario">
            <label for="imagem">Imagem do seu post</label>
            <input type="file" id="imagem" name="imagem" accept="image/*"/>
          </div>
          <button type="submit" class="botao-form">Postar</button>
        </form>
    </div>
    <script>
      nomeUsers.innerHTML = sessionStorage.NOME_USUARIO;
      
      
      function publicarPost(event) {
  let titulo = document.getElementById('titulo').value;
  let conteudo = document.getElementById('conteudo').value;
  let imagem = document.getElementById('imagem').files[0];
  let fkUsuario = sessionStorage.getItem("ID_USUARIO");

  let formData = new FormData();
  formData.append("tituloServer", titulo);
  formData.append("conteudoServer", conteudo);
  formData.append("fkUsuarioServer", fkUsuario);
  formData.append("imagem", imagem);

  fetch('/posts/cadastrar', {
    method: 'POST',
    body: formData
  })
  .then(res => res.json())
  .then(data => {
    console.log(data);
    alert('Post publicado com sucesso!');
    window.location.href = 'posts.html';
  })
  .catch(err => {
    console.error(err);
    alert('Erro ao publicar post!');
  });
}
</script>
  </body>
</html>
