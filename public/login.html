<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="assets/style.css">

</head>
<body>
    <div class="cabecalho">
        <a class="logo" href="index.html">
            <img src="assets/images/logo.png" alt="Logo Otherside Culture">
        </a>
        <nav class="cabecalho-nav">
            <ul>
                <li><a href="index.html">Início</a></li>
            </ul>
        </nav>
    </div>
    
    <div class="secao-form">
        <div class="container-form">
            <h2>Entrar na sua conta</h2>
                <div class="campo-formulario">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="campo-formulario">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required>
                </div>
                <button type="button" class="botao-form" onclick="entrar()">Entrar</button>
     <p class="link-form">Não possui uma conta? <a href="cadastro.html">Cadastre-se aqui</a></p>
        </div>
    </div>

    <script>
        function entrar() {
        var emailVar = document.getElementById("email").value;
        var senhaVar = document.getElementById("senha").value;

        if (emailVar == "" || senhaVar == "") {
            alert("Preencha todos os campos!");
            return false;
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;

                    setTimeout(function () {
                        window.location = "./metricas.html";
                    }, 1000); 

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }
    </script>
</body>
</html>
